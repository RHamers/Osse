<!-- Android/app/src/main/assets/potoken/index.html -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script type="module">
  import { getChallenge, BotGuardClient } from './exports/botguard.js';
  import { WebPoMinter } from './exports/webpo.js';
  import { buildURL, getHeaders } from './exports/utils.js';

  // A stable, widely-used public web request key for the BotGuard "Create" challenge
  // call — not a secret, not tied to any Google account, the same one bgutils-js's own
  // examples use.
  const REQUEST_KEY = 'O43z0dpjhgX20SCx4KAo';

  // The BotGuard challenge/integrity-token setup is expensive (several network round
  // trips) but not video-specific — cache it and reuse across videos until its
  // server-given TTL expires. Only the final mintAsWebsafeString(videoId) call below
  // needs to vary per video, and that's a cheap local computation.
  let cachedMinter = null; // { minter, readyAtMs, estimatedTtlSecs }

  async function ensureMinter() {
    const now = Date.now();
    if (cachedMinter && (now - cachedMinter.readyAtMs) < cachedMinter.estimatedTtlSecs * 1000) {
      return cachedMinter.minter;
    }

    const challengeResponse = await getChallenge({
      requestKey: REQUEST_KEY,
      fetchFunction: fetch,
      useYouTubeAPI: false,
    });
    if (!challengeResponse.program) {
      throw new Error('no BotGuard challenge program returned');
    }

    const interpreterUrl = challengeResponse.interpreterUrl
      ?.privateDoNotAccessOrElseTrustedResourceUrlWrappedValue;
    const interpreterJavascript = interpreterUrl
      ? await (await fetch(`https:${interpreterUrl}`)).text()
      : challengeResponse.interpreterJavascript
          ?.privateDoNotAccessOrElseSafeScriptWrappedValue;
    if (!interpreterJavascript) {
      throw new Error('no BotGuard interpreter javascript available');
    }
    new Function(interpreterJavascript)();

    const botGuardClient = await BotGuardClient.create({
      program: challengeResponse.program,
      globalName: challengeResponse.globalName,
      globalObject: globalThis,
    });
    const webPoSignalOutput = [];
    const botguardResponse = await botGuardClient.snapshot({ webPoSignalOutput });

    const integrityTokenResponse = await fetch(
      buildURL('GenerateIT', false),
      {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify([REQUEST_KEY, botguardResponse]),
      },
    );
    const integrityTokenJson = await integrityTokenResponse.json();
    const [integrityToken, estimatedTtlSecs, mintRefreshThreshold, websafeFallbackToken] = integrityTokenJson;

    const webPoMinter = await WebPoMinter.create(
      { integrityToken, estimatedTtlSecs, mintRefreshThreshold, websafeFallbackToken },
      webPoSignalOutput,
    );
    cachedMinter = { minter: webPoMinter, readyAtMs: now, estimatedTtlSecs };
    return webPoMinter;
  }

  window.mintToken = function (videoId) {
    ensureMinter()
      .then((minter) => minter.mintAsWebsafeString(videoId))
      .then((poToken) => {
        window.AndroidBridge.onToken(poToken, String(cachedMinter.estimatedTtlSecs));
      })
      .catch((e) => {
        const msg = (e && e.message) ? e.message : String(e);
        window.AndroidBridge.onError(msg);
      });
  };
</script>
</body>
</html>
